<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sticky-claude dashboard</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --border: #3a3a3a;
      --text: #f0f0f0;
      --muted: #999;
      --accent: #7b5cff;
      --accent-active: #6a4ce0;
      --ok: #4caf50;
      --bad: #e05656;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 15px; margin: 0 0 4px; text-transform: uppercase;
               letter-spacing: 0.04em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .card p.plugin-desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px; }
    .status-grid .label { color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 10px 18px; border-radius: 9px; border: none; background: var(--accent);
      color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
    }
    button:active { background: var(--accent-active); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .field[hidden] { display: none; }
    .event, .history-item {
      padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .event:last-child, .history-item:last-child { border-bottom: none; }
    .event .when, .history-item .when { color: var(--muted); font-size: 12px; }
    .history-item .transcript { color: var(--muted); margin-top: 4px; }
    .history-item .reply { margin-top: 4px; }
    .history-item.failed .reply { color: var(--bad); }
    .empty { color: var(--muted); font-size: 14px; }
    .save-msg { font-size: 13px; margin-top: 10px; color: var(--ok); display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>sticky-claude</h1>
    <p class="sub">Dashboard</p>

    <div class="card">
      <h2>Status</h2>
      <div class="status-grid" id="status-grid">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <div class="card">
      <h2>Core settings</h2>
      <label for="anthropic-key">Anthropic API key</label>
      <input id="anthropic-key" type="password" placeholder="sk-ant-...">

      <label for="claude-model">Claude model</label>
      <input id="claude-model" type="text" placeholder="claude-haiku-5-5">

      <button type="button" onclick="saveCoreSettings()">Save</button>
      <div class="save-msg" id="core-save-msg">Saved.</div>
    </div>

    <!-- Plugin cards (settings form + the calendar plugin's events view)
         are injected here by renderPlugins(). A plugin's settings form is
         fully generic (built from its settings_schema); the "Upcoming
         events" list is the one plugin-aware bit of UI left -- a future
         plugin wanting its own dashboard view would need a small addition
         here, same as calendar's. -->
    <div id="plugins"></div>

    <div class="card">
      <h2>Recent conversations</h2>
      <div id="history"><div class="empty">Loading...</div></div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      const status = await fetch('/api/status').then(r => r.json());
      const grid = document.getElementById('status-grid');
      const seen = status.last_seen ? new Date(status.last_seen).toLocaleString() : 'never';
      grid.innerHTML = `
        <div class="label">Device last seen</div><div>${seen}</div>
        <div class="label">Device IP</div><div>${status.last_ip || '--'}</div>
        <div class="label">Claude model</div><div>${status.claude_model}</div>
        <div class="label">Whisper model</div><div>${status.whisper_model}</div>
        <div class="label">Anthropic key</div>
        <div><span class="dot ${status.anthropic_configured ? 'ok' : 'bad'}"></span>${status.anthropic_configured ? 'Configured' : 'Not set'}</div>
      `;
    }

    async function loadHistory() {
      const history = await fetch('/api/history').then(r => r.json());
      const el = document.getElementById('history');
      if (!history.length) {
        el.innerHTML = '<div class="empty">No conversations yet.</div>';
        return;
      }
      el.innerHTML = history.map(h => `
        <div class="history-item ${h.success ? '' : 'failed'}">
          <div class="when">${new Date(h.created_at).toLocaleString()}</div>
          <div class="transcript">"${escapeHtml(h.transcript)}"</div>
          <div class="reply">${escapeHtml(h.success ? h.reply : (h.error_message || 'Failed'))}</div>
        </div>
      `).join('');
    }

    async function loadCoreSettings() {
      const config = await fetch('/api/settings').then(r => r.json());
      document.getElementById('claude-model').value = config.claude_model || '';
    }

    async function saveCoreSettings() {
      const body = { claude_model: document.getElementById('claude-model').value };
      const key = document.getElementById('anthropic-key').value;
      if (key) body.anthropic_api_key = key;
      await fetch('/api/settings', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
      });
      flashSaved('core-save-msg');
      loadStatus();
    }

    function fieldInputId(pluginId, key) { return `field-${pluginId}-${key}`; }

    function renderField(pluginId, field) {
      if (field.type === 'button') {
        return `<button type="button" class="secondary" onclick="window.open('${field.button_url}', '_blank')">${field.button_label}</button>`;
      }
      const id = fieldInputId(pluginId, field.key);
      const labelHtml = field.label ? `<label for="${id}">${escapeHtml(field.label)}</label>` : '';
      if (field.type === 'select') {
        const options = (field.options || []).map(o =>
          `<option value="${escapeHtml(o.value)}" ${o.value === field.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`
        ).join('');
        return `${labelHtml}<select id="${id}" data-key="${field.key}">${options}</select>`;
      }
      const value = field.type === 'password' ? '' : (field.value || '');
      const placeholder = field.type === 'password' && field.value ? field.value : (field.placeholder || '');
      return `${labelHtml}<input id="${id}" type="${field.type}" data-key="${field.key}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}">`;
    }

    function applyShowIf(pluginId, fields) {
      for (const field of fields) {
        if (!field.show_if) continue;
        const [depKey, expected] = field.show_if;
        const depEl = document.getElementById(fieldInputId(pluginId, depKey));
        const wrapper = document.getElementById(`${fieldInputId(pluginId, field.key)}-wrap`);
        if (!depEl || !wrapper) continue;
        wrapper.hidden = depEl.value !== expected;
      }
    }

    async function renderPlugins() {
      const pluginList = await fetch('/api/plugins').then(r => r.json());
      const container = document.getElementById('plugins');
      container.innerHTML = pluginList.map(plugin => `
        <div class="card">
          <h2><span class="dot ${plugin.configured ? 'ok' : 'bad'}"></span>${escapeHtml(plugin.name)}</h2>
          <p class="plugin-desc">${escapeHtml(plugin.description)}</p>
          ${plugin.fields.map(f => `<div class="field" id="${fieldInputId(plugin.id, f.key)}-wrap">${renderField(plugin.id, f)}</div>`).join('')}
          <button type="button" onclick="savePluginSettings('${plugin.id}')">Save</button>
          <div class="save-msg" id="save-msg-${plugin.id}">Saved.</div>
          ${plugin.id === 'calendar' ? `
            <h2 style="margin-top:24px">Upcoming events</h2>
            <div id="calendar-events"><div class="empty">Loading...</div></div>
          ` : ''}
        </div>
      `).join('');

      for (const plugin of pluginList) {
        applyShowIf(plugin.id, plugin.fields);
        for (const field of plugin.fields) {
          if (field.type !== 'select') continue;
          const el = document.getElementById(fieldInputId(plugin.id, field.key));
          el.addEventListener('change', () => applyShowIf(plugin.id, plugin.fields));
        }
      }

      if (pluginList.some(p => p.id === 'calendar')) {
        loadCalendarEvents();
      }
    }

    async function savePluginSettings(pluginId) {
      const inputs = document.querySelectorAll(`[id^="field-${pluginId}-"]`);
      const body = {};
      inputs.forEach(el => { if (el.dataset.key) body[el.dataset.key] = el.value; });
      await fetch(`/api/plugins/${pluginId}/settings`, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
      });
      flashSaved(`save-msg-${pluginId}`);
      renderPlugins();
    }

    async function loadCalendarEvents() {
      const data = await fetch('/api/plugins/calendar/view').then(r => r.json());
      const el = document.getElementById('calendar-events');
      const events = data.events || [];
      if (data.error) {
        el.innerHTML = `<div class="empty">Couldn't load events: ${escapeHtml(data.error)}</div>`;
        return;
      }
      if (!events.length) {
        el.innerHTML = '<div class="empty">No upcoming events, or calendar not configured.</div>';
        return;
      }
      el.innerHTML = events.map(e => `
        <div class="event">
          <div class="when">${new Date(e.start).toLocaleString()}</div>
          <div>${escapeHtml(e.summary)}</div>
        </div>
      `).join('');
    }

    function flashSaved(id) {
      const msg = document.getElementById(id);
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    loadStatus();
    loadHistory();
    loadCoreSettings();
    renderPlugins();
  </script>
</body>
</html>
